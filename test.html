<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 測試</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;line-height:1.8;}
button{background:#1db954;border:none;color:#000;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;margin:6px 4px;}
.section{background:#1a1a2e;border:1px solid #333;border-radius:10px;padding:16px;margin:14px 0;}
.ok{color:#1db954;}
.err{color:#ff4d6d;}
.warn{color:#ffd60a;}
pre{background:#0a0a10;padding:12px;border-radius:6px;overflow-x:auto;font-size:12px;white-space:pre-wrap;}
input{background:#222;border:1px solid #444;color:#eee;padding:8px;border-radius:6px;width:100%;margin:4px 0;font-family:monospace;}
</style>
</head>
<body>
<h2>🧪 間歇跑 DJ — API 測試頁</h2>

<!-- STEP 1: Spotify Login -->
<div class="section">
  <h3>Step 1：Spotify 登入</h3>
  <div id="spStatus" class="warn">未連結</div>
  <button onclick="spotifyLogin()">連結 Spotify</button>
  <button onclick="disconnect()">中斷</button>
</div>

<!-- STEP 2: Test playlist tracks -->
<div class="section">
  <h3>Step 2：測試讀取歌單內的歌曲</h3>
  <p style="font-size:12px;color:#888">貼上你的 Spotify 歌單 ID（URL 裡 playlist/ 後面那串）</p>
  <input id="plInput" placeholder="例如：37i9dQZF1DXcBWIGoYBM5M" value="">
  <button onclick="testPlaylistTracks()">測試讀取歌曲</button>
  <div id="plResult"></div>
</div>

<!-- STEP 3: Test ReccoBeats -->
<div class="section">
  <h3>Step 3：測試 ReccoBeats BPM 查詢</h3>
  <p style="font-size:12px;color:#888">輸入歌名和歌手名，測試能不能查到 BPM</p>
  <input id="trackInput" placeholder="歌名" value="心臓を捧げよ">
  <input id="artistInput" placeholder="歌手名" value="Linked Horizon">
  <button onclick="testReccoBeats()">查詢 BPM</button>
  <div id="rbResult"></div>
</div>

<!-- STEP 4: Full pipeline test -->
<div class="section">
  <h3>Step 4：完整流程測試（歌單 → ReccoBeats BPM）</h3>
  <p style="font-size:12px;color:#888">從歌單讀前 5 首歌，用 ReccoBeats 查各自的 BPM</p>
  <button onclick="testFullPipeline()">執行完整測試</button>
  <div id="pipeResult"></div>
</div>

<script>
// ══ SPOTIFY PKCE ══
var SP = {
  clientId: '28fc753aed184f1ba18f509ce6abee11',
  redirectUri: 'https://berton1979.github.io/interval-dj/test.html',
  token: null, expiry: 0
};

function b64url(buf) {
  return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function spotifyLogin() {
  var v = b64url(crypto.getRandomValues(new Uint8Array(32)));
  sessionStorage.setItem('spv', v);
  var ch = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(v)));
  var p = new URLSearchParams({
    client_id: SP.clientId,
    response_type: 'code',
    redirect_uri: SP.redirectUri,
    code_challenge_method: 'S256',
    code_challenge: ch,
    scope: 'playlist-read-private playlist-read-collaborative user-read-private'
  });
  window.location.href = 'https://accounts.spotify.com/authorize?' + p;
}

async function handleCallback() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  if (!code) { checkStored(); return; }
  window.history.replaceState({}, '', window.location.pathname);
  var v = sessionStorage.getItem('spv');
  sessionStorage.removeItem('spv');
  if (!v) return;
  try {
    var res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({
        client_id: SP.clientId,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: SP.redirectUri,
        code_verifier: v
      })
    });
    var d = await res.json();
    if (d.access_token) {
      SP.token = d.access_token;
      SP.expiry = Date.now() + (d.expires_in - 60) * 1000;
      sessionStorage.setItem('sp_token', SP.token);
      sessionStorage.setItem('sp_expiry', SP.expiry);
      updateSpStatus();
    }
  } catch(e) { log('spStatus', '❌ Token 交換失敗: ' + e.message, 'err'); }
}

function checkStored() {
  var t = sessionStorage.getItem('sp_token');
  var e = parseInt(sessionStorage.getItem('sp_expiry') || '0');
  if (t && Date.now() < e) { SP.token = t; SP.expiry = e; updateSpStatus(); }
}

function disconnect() {
  SP.token = null; SP.expiry = 0;
  sessionStorage.removeItem('sp_token'); sessionStorage.removeItem('sp_expiry');
  document.getElementById('spStatus').innerHTML = '<span class="warn">已中斷</span>';
}

function updateSpStatus() {
  document.getElementById('spStatus').innerHTML = '<span class="ok">✓ Spotify 已連結</span>';
}

function log(id, msg, cls) {
  document.getElementById(id).innerHTML = '<div class="' + (cls||'') + '">' + msg + '</div>';
}

// ══ STEP 2: Spotify playlist tracks ══
async function testPlaylistTracks() {
  if (!SP.token) { log('plResult', '❌ 請先連結 Spotify', 'err'); return; }
  var plId = document.getElementById('plInput').value.trim();
  if (!plId) { log('plResult', '❌ 請輸入歌單 ID', 'err'); return; }
  log('plResult', '⏳ 查詢中…', 'warn');
  try {
    var res = await fetch(
      'https://api.spotify.com/v1/playlists/' + plId + '/tracks?limit=5&fields=items(track(id,name,artists))',
      { headers: { 'Authorization': 'Bearer ' + SP.token } }
    );
    var d = await res.json();
    if (!res.ok) {
      log('plResult', '❌ HTTP ' + res.status + '<pre>' + JSON.stringify(d, null, 2) + '</pre>', 'err');
      return;
    }
    var tracks = (d.items || []).filter(function(i){ return i.track; });
    var html = '<span class="ok">✓ 成功讀取 ' + tracks.length + ' 首歌曲</span><pre>';
    tracks.forEach(function(i, n) {
      var t = i.track;
      html += (n+1) + '. ' + t.name + ' — ' + t.artists.map(function(a){return a.name;}).join(', ') + ' [' + t.id + ']\n';
    });
    html += '</pre>';
    log('plResult', html);
    // 存起來給 Step 4 用
    window._testTracks = tracks.map(function(i){ return i.track; });
  } catch(e) {
    log('plResult', '❌ 錯誤: ' + e.message, 'err');
  }
}

// ══ STEP 3: Spotify Search → ReccoBeats BPM ══
async function testReccoBeats() {
  if (!SP.token) { log('rbResult', '❌ 請先連結 Spotify（Step 1）', 'err'); return; }
  var title = document.getElementById('trackInput').value.trim();
  var artist = document.getElementById('artistInput').value.trim();
  if (!title) { log('rbResult', '❌ 請輸入歌名', 'err'); return; }
  log('rbResult', '⏳ 第一步：用 Spotify Search 找 Track ID…', 'warn');

  try {
    // Step A: Spotify Search（這個沒有被封鎖）
    var q = title + (artist ? ' artist:' + artist : '');
    var sr = await fetch(
      'https://api.spotify.com/v1/search?q=' + encodeURIComponent(q) + '&type=track&limit=1&market=TW',
      { headers: { 'Authorization': 'Bearer ' + SP.token } }
    );
    var sd = await sr.json();

    if (!sr.ok) {
      log('rbResult', '❌ Spotify Search 失敗 HTTP ' + sr.status + '<pre>' + JSON.stringify(sd,null,2) + '</pre>', 'err');
      return;
    }

    var tracks = sd.tracks && sd.tracks.items;
    if (!tracks || !tracks.length) {
      log('rbResult', '❌ Spotify 找不到這首歌', 'err');
      return;
    }

    var spotifyId = tracks[0].id;
    var spotifyName = tracks[0].name;
    var spotifyArtist = tracks[0].artists[0].name;
    var html = '<span class="ok">✓ Spotify 找到：' + spotifyName + ' — ' + spotifyArtist + '</span><br>';
    html += '<span style="color:#888">Spotify ID: ' + spotifyId + '</span><br><br>';
    html += '⏳ 第二步：用 Spotify ID 查 ReccoBeats BPM…<br>';
    log('rbResult', html);

    // Step B: ReccoBeats Audio Features（正確端點）
    // 先試 /v1/audio-features?ids= 
    var fr = await fetch('https://api.reccobeats.com/v1/audio-features?ids=' + spotifyId);
    var fd = await fr.json();
    html += '<br><b>ReccoBeats /v1/audio-features 回傳：</b><pre>' + JSON.stringify(fd,null,2) + '</pre>';

    // 再試 /v1/track?ids= 看能不能找到這首歌
    var tr = await fetch('https://api.reccobeats.com/v1/track?ids=' + spotifyId);
    var td = await tr.json();
    html += '<br><b>ReccoBeats /v1/track 回傳：</b><pre>' + JSON.stringify(td,null,2) + '</pre>';

    // 如果找到 ReccoBeats track ID，再用它查 audio features
    var rbTracks = Array.isArray(td) ? td : (td.content || []);
    if (rbTracks.length && rbTracks[0].id) {
      var rbId = rbTracks[0].id;
      var fr2 = await fetch('https://api.reccobeats.com/v1/track/' + rbId + '/audio-features');
      var fd2 = await fr2.json();
      html += '<br><b>ReccoBeats /v1/track/{rbId}/audio-features：</b><pre>' + JSON.stringify(fd2,null,2) + '</pre>';
      if (fd2 && fd2.tempo) {
        html += '<span class="ok" style="font-size:16px">✓ BPM = <strong style="color:#ffd60a">' + Math.round(fd2.tempo) + '</strong></span>';
      }
    }
    log('rbResult', html);

  } catch(e) {
    log('rbResult', '❌ 錯誤: ' + e.message, 'err');
  }
}

// ══ STEP 4: Full pipeline ══
async function testFullPipeline() {
  if (!SP.token) { log('pipeResult','❌ 請先連結 Spotify','err'); return; }
  var plId = document.getElementById('plInput').value.trim();
  if (!plId) { log('pipeResult','❌ 請先在 Step 2 輸入歌單 ID','err'); return; }
  log('pipeResult', '⏳ 改用 Spotify Search 模式測試 5 首歌…', 'warn');

  // 用搜尋測試幾首已知歌曲
  var testSongs = [
    {title:'Blinding Lights', artist:'The Weeknd'},
    {title:'Shape of You', artist:'Ed Sheeran'},
    {title:'FLY HIGH!!', artist:'BURNOUT SYNDROMES'},
    {title:'心臓を捧げよ', artist:'Linked Horizon'},
    {title:'LOST IN PARADISE', artist:'ALI'},
    {title:'Inferno', artist:'Mrs. GREEN APPLE'},
    {title:'Running in the 90s', artist:'Max Coveri'},
    {title:'Eye of the Tiger', artist:'Survivor'}
  ];

  var html = '<table style="width:100%;border-collapse:collapse;font-size:12px;">';
  html += '<tr style="color:#888;border-bottom:1px solid #333"><td style="padding:6px 8px">歌名</td><td>歌手</td><td>Spotify ID</td><td>ReccoBeats BPM</td></tr>';

  for (var i = 0; i < testSongs.length; i++) {
    var s = testSongs[i];
    try {
      var q = s.title + ' artist:' + s.artist;
      var sr = await fetch(
        'https://api.spotify.com/v1/search?q=' + encodeURIComponent(q) + '&type=track&limit=1&market=TW',
        { headers: { 'Authorization': 'Bearer ' + SP.token } }
      );
      var sd = await sr.json();
      var tracks = sd.tracks && sd.tracks.items;
      if (!tracks || !tracks.length) {
        html += '<tr><td style="padding:5px 8px">' + s.title + '</td><td>' + s.artist + '</td><td class="err">找不到</td><td>—</td></tr>';
        continue;
      }
      var spId = tracks[0].id;

      var fr = await fetch('https://api.reccobeats.com/v1/audio-features?ids=' + spId);
      var fd = await fr.json();
      var feats = Array.isArray(fd) ? fd : (fd.content || []);
      var feat = feats[0];
      var bpm = feat && feat.tempo ? Math.round(feat.tempo) : null;

      // 如果沒找到，試用 /v1/track?ids= 再查
      if (!bpm) {
        var tr2 = await fetch('https://api.reccobeats.com/v1/track?ids=' + spId);
        var td2 = await tr2.json();
        var rbTracks = Array.isArray(td2) ? td2 : (td2.content || []);
        if (rbTracks.length && rbTracks[0].id) {
          var fr3 = await fetch('https://api.reccobeats.com/v1/track/' + rbTracks[0].id + '/audio-features');
          var fd3 = await fr3.json();
          if (fd3 && fd3.tempo) bpm = Math.round(fd3.tempo);
        }
      }

      html += '<tr><td style="padding:5px 8px">' + s.title + '</td><td>' + s.artist + '</td>' +
        '<td style="font-size:10px;color:#888">' + spId.substring(0,8) + '…</td>' +
        '<td style="color:' + (bpm ? '#ffd60a' : '#ff4d6d') + ';font-weight:bold">' + (bpm ? bpm + ' BPM ✓' : '無資料 ✗') + '</td></tr>';
    } catch(e) {
      html += '<tr><td style="padding:5px 8px">' + s.title + '</td><td>' + s.artist + '</td><td class="err">錯誤</td><td>—</td></tr>';
    }
  }
  html += '</table>';
  log('pipeResult', html);
}

// Init
handleCallback();
</script>
</body>
</html>
